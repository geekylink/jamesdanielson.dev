<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#120f24" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
    <script>
      // Apply saved display settings before first paint so the page never flashes the wrong colors.
      (function () {
        try {
          var d = document.documentElement;
          d.dataset.theme = localStorage.getItem('theme') || 'green';
          d.dataset.crt = localStorage.getItem('crt') || 'on';
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!reduce && !sessionStorage.getItem('boot-seen')) d.dataset.boot = 'animate';
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
